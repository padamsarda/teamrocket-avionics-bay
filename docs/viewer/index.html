<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>*,*::before,*::after{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}</style>
<title>Avionics Sensor Plate</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-height split — 3D bench on the left, control rail on the right; stacks on phones */
:root{
  --bg:#eef1f3; --panel:#ffffff; --ink:#18212b; --muted:#5b6875; --line:#d5dbe1;
  --accent:#0d7c86; --accent-ink:#ffffff; --scene:#dfe5ea;
  --ok:#1f8a4c; --warn:#b26a00; --bad:#c0392b; --mag:#d417c9;
  --f-display:"Space Grotesk",system-ui,sans-serif; --f-body:"Inter",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161b; --panel:#182028; --ink:#e4eaf0; --muted:#93a1ae; --line:#2a3540;
  --accent:#3cc0c9; --accent-ink:#0b1216; --scene:#151c23; --ok:#4cc27e; --warn:#e3a33b; --bad:#ef6b5e; --mag:#f04be6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161b; --panel:#182028; --ink:#e4eaf0; --muted:#93a1ae; --line:#2a3540;
  --accent:#3cc0c9; --accent-ink:#0b1216; --scene:#151c23; --ok:#4cc27e; --warn:#e3a33b; --bad:#ef6b5e; --mag:#f04be6; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px}
.app{height:100%;display:flex;gap:12px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.stage{flex:1;min-width:0;position:relative;border-radius:10px;overflow:hidden;background:var(--scene);border:1px solid var(--line)}
#c{display:block;width:100%;height:100%;touch-action:none}
.views{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap}
.toggles{position:absolute;bottom:10px;left:10px;display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.toggles label{display:flex;gap:5px;align-items:center;cursor:pointer}
.legend{position:absolute;top:10px;right:10px;font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:grid;gap:3px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.rail{width:340px;flex:none;display:flex;flex-direction:column;gap:10px;min-height:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
h1{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0 0 2px;text-wrap:balance}
.sub{color:var(--muted);font-size:12px;margin:0}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px}
button{font-family:var(--f-body);font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.list{display:flex;flex-direction:column;gap:4px;overflow:auto;min-height:0;flex:1}
.row{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;text-align:left;padding:7px 9px;border-radius:7px}
.row.sel{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.row .nm{font-weight:600}
.row .meta{font-family:var(--f-mono);font-size:11px;color:var(--muted);grid-column:1/-1}
.chip{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.chip.ok{color:var(--ok)} .chip.warn{color:var(--warn)} .chip.bad{color:var(--bad)} .chip.info{color:var(--muted)}
.pad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,38px);gap:5px;justify-content:center}
.pad button{padding:0;font-size:16px}
.ctl{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.readout{font-family:var(--f-mono);font-size:12px;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin-top:10px;font-variant-numeric:tabular-nums}
.readout dt{color:var(--muted)} .readout dd{margin:0;text-align:right}
.foot{display:flex;gap:6px;flex-wrap:wrap}
textarea{width:100%;box-sizing:border-box;height:90px;font-family:var(--f-mono);font-size:11px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:7px;margin-top:8px}
.kbd{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
@media (max-width:820px){.app{flex-direction:column;height:auto}.stage{height:62vh;flex:none}.rail{width:auto}.list{max-height:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <div class="stage">
    <canvas id="c" aria-label="3D view of the sensor plate"></canvas>
    <div class="views">
      <button data-view="iso">Iso</button><button data-view="front">Front (sensor face)</button>
      <button data-view="nose">From nose</button><button data-view="side">Side</button><button data-view="back">Back (board 2)</button>
    </div>
    <div class="legend">
      <span><i style="background:#ff00ff"></i>IC centre</span>
      <span><i style="background:#00d8e0"></i>Rocket axis</span>
      <span><i style="background:#c9a36b"></i>Perfboard 2.54 mm</span>
      <span><i style="background:#d62828"></i>Pyro / power wires</span>
    </div>
    <div class="toggles">
      <label><input type="checkbox" id="tTube" checked> Ø64 tube</label>
      <label><input type="checkbox" id="tAxis" checked> Axis</label>
      <label><input type="checkbox" id="tFoot"> Footprints</label>
      <label><input type="checkbox" id="tB2" checked> Board 2</label>
      <label>Layout <select id="tMode" aria-label="Layout version"><option value="sandwich">Sandwich (2 boards)</option><option value="single">Single board (old)</option></select></label>
      <label id="mountLab">Mount <select id="tMount" aria-label="Bay mount version"><option value="none">none</option><option value="v1">V1 slide-in rails</option><option value="v2">V2 backplate (frame + grommets)</option></select></label>
    </div>
  </div>

  <aside class="rail">
    <div class="card">
      <h1>Avionics Sensor Plate</h1>
      <p class="sub" id="summary">Loading…</p>
    </div>

    <div class="card">
      <p class="label">Move selected · 1 step = 1 hole (2.54 mm)</p>
      <div class="ctl">
        <div class="pad">
          <span></span><button id="mUp" aria-label="Move toward nose">▲</button><span></span>
          <button id="mLeft" aria-label="Move left">◀</button><button id="mRot" aria-label="Rotate 90 degrees">⟲</button><button id="mRight" aria-label="Move right">▶</button>
          <button id="mBrd" aria-label="Move to the other board" title="Move to the other board (B)">⇅</button><button id="mDown" aria-label="Move toward tail">▼</button><button id="mFlip" aria-label="Flip to other face" title="Flip front/back face (F)">⇆</button>
        </div>
        <dl class="readout" id="readout"></dl>
      </div>
      <p class="kbd" style="margin:8px 0 0">Keys: arrows move · R rotates · F flips face · B swaps board · View: left-drag orbit · wheel-click drag pan · scroll zoom</p>
    </div>

    <div class="card" style="flex:1;display:flex;flex-direction:column;min-height:0">
      <p class="label">Parts (tail → nose)</p>
      <div class="list" id="list"></div>
    </div>

    <div class="card">
      <div class="foot">
        <button class="primary" id="bCopy">Copy layout for Claude</button>
        <button id="bReset">Reset layout</button>
      </div>
      <textarea id="out" readonly aria-label="Layout JSON" hidden></textarea>
    </div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="meshes.js"></script>
<script>
(() => {
const P = 2.54, GU0 = -P/2, TUBE_R = 32, PLATE_T = 2.4;   // thicker perfboard (face stays fixed, extra thickness goes backwards)
let MODE = "sandwich"; try { MODE = localStorage.getItem("sensorPlateMode") || "sandwich"; } catch(e){}
const SPACER = 8;                   // sandwich: standoff length = gap between board 1's solder side and board 2's solder side (mm); only trimmed pins + wiring live here
const PLATE_TOP = -4.49;            // sensor face of the perfboard, mm from axis (puts IMU IC centroids on axis)
// ---- board library (local frame: origin = PCB bottom-left, z up, mm) ----
const range = (n,f) => Array.from({length:n},(_,i)=>f(i));
const LIB = {
  BMI270:  {label:"BMI270 · 7Semi EVE", kind:"IMU", ic:[16.27,14.25], zc:1.99, sp:2.5,
            pins: range(7,i=>[7.38+i*P,2.5])},
  LSM6DSO: {label:"LSM6DSO · SmartElex", kind:"IMU", ic:[12.7,12.7], zc:1.99, sp:2.5,
            pins: range(6,i=>[1.27,6.35+i*P]).concat(range(6,i=>[24.13,6.35+i*P]))},
  BMP280:  {label:"BMP280 · GY-BMP280", kind:"Baro", ic:[7.35,7.55], zc:2.035, sp:2.5,
            pins: range(6,i=>[1.155+i*P,1.495])},
  MS5611:  {label:"MS5611 · GY-63", kind:"Baro", ic:[10.16,9.75], zc:1.74, sp:2.54,
            pins: range(7,i=>[0.97,1.9+i*P])},
  ESP32:   {label:"ESP32 DevKitC V4", kind:"MCU", ic:[12.55,38.75], zc:3.6, sp:2.54,
            pins: range(19,i=>[1.35,1.27+i*P]).concat(range(19,i=>[26.75,1.27+i*P]))},
  SDCARD:  {label:"Waveshare Micro SD board (built from vendor drawing)", kind:"Storage", ic:[22.75,10.1], zc:1.0, sp:2.5,
            pins: range(9,i=>[1.27,1.47+i*P])},
  // placeholders (boxes): size = [across, along, height] in mm
  LDO:   {label:"LDO 3.3 V sensor rail · TI LP2950-33 (TO-92)", kind:"Power", box:[5.2,4.2,5.2], col:0x222222, sp:3, pins:[[1.27,1.27]]},
  BUCK:  {label:"Buck 3.3 V 600 mA fixed · 7Semi (placeholder, 16 × 10 × 3)", kind:"Power", box:[10,16,3], col:0x1f7a3a, sp:2, pins:[[1.27,1.27]]},
  SPACER:{label:"M3 × 12 standoff through both boards", kind:"Spacer", box:[6,6,SPACER], col:0xb9bec4, sp:0, pins:[[3,3]], hex:true},
  TO220: {label:"TO-220 MOSFET (KiCad TO-220-3 Vertical model)", kind:"Power", ic:[2.54,0.9], zc:9, sp:0, pins:[[0,0],[2.54,0],[5.08,0]]},
  BUZZ:  {label:"Buzzer SFM-27-I (Ø23 × 15, 3–24 V)", kind:"Power", box:[23,23,15], col:0x111111, sp:0, pins:[[1.27,1.27]], cylZ:true},
  PYRO:  {label:"Ejection charge Ø10 × 30 mm (placeholder)", kind:"Pyro", box:[10,30,10], col:0xb3261e, sp:0, pins:[[0,0]], cyl:true},
  BATT:  {label:"2S 600 mAh LiPo (placeholder)", kind:"Batt", box:[31,60,15], col:0x2b7bd8, sp:0, pins:[[0,0]]},
};
for (const k in LIB){ const L = LIB[k];
  if (L.box){ L.bmin=[0,0,0]; L.bmax=[L.box[0],L.box[1],L.box[2]]; L.ic=[L.box[0]/2,L.box[1]/2]; L.zc=L.box[2]/2; }
  else { const m = window.BOARD_MESH[k]; L.bmin = m.bmin.slice(); L.bmax = m.bmax.slice(); } }
Object.assign(LIB.BMI270,{top:2.6}); Object.assign(LIB.LSM6DSO,{top:2.5}); Object.assign(LIB.BMP280,{top:2.6}); Object.assign(LIB.MS5611,{top:3.2});   // real component-top height (mesh bbox includes the marker)
const BTOP = {1: PLATE_TOP, 2: PLATE_TOP - PLATE_T - SPACER};      // +Z face of each perfboard; board 2 sits BEHIND board 1, its parts face outward (-Z)
const brdOf = b => (MODE==="sandwich" && b.brd===2) ? 2 : 1;
LIB.ESP32.bmax[1] += 15; LIB.ESP32.ko = 15; LIB.ESP32.kox = [5.05, 23.05];   // 15 mm antenna keep-out beyond the board end counts as part of its footprint
// what each part talks over (shown as 3D labels); CS pins are a proposal on VSPI (SCK 18 · MISO 19 · MOSI 23)
const PROTO = { BMP280_A:"SPI · CS GPIO4", BMP280_B:"SPI · CS GPIO13", MS5611:"SPI · CS GPIO16 (PS→GND)",
  LSM6DSO:"SPI · CS GPIO17", BMI270_A:"SPI · CS GPIO21", BMI270_B:"SPI · CS GPIO22",
  ESP32:"SPI master · VSPI 18/19/23", LDO_3V3:"TI LP2950-33 → sensor rail", BATTERY:"2S 600 mAh",
  SD:"SDMMC 1-bit · CLK14 CMD15 D0→GPIO2 · CD→39", PYRO_A:"charge A · GPIO32 channel", PYRO_B:"charge B · GPIO33 channel",
  LM317_A:"ST LM317T · 1.04 A limit · ch A", LM317_B:"ST LM317T · 1.04 A limit · ch B",
  MOSFET_A:"Infineon IRLZ44NPBF · gate GPIO32", MOSFET_B:"Vishay IRL530PBF · gate GPIO33",
  BUZZER:"SFM-27-I buzzer · GPIO5 via 2N7000", BUCK_3V3:"7Semi 3.3 V 600 mA → ESP32 + SD (placeholder)" };
let MOUNT = "none"; try { MOUNT = localStorage.getItem("sensorPlateMount") || "none"; } catch(e){}
const mnt = () => MOUNT;
// sandwich mounts (CAD/Bay_Mount_Sandwich): per-board perfboard extents [u0,u1,v0,v1] + battery / charge shifts
const MOUNT_EXT_S = { v1:{1:[-25.4,25.4,-3.81,168.91], 2:[-22.86,22.86,1.27,158.75], batt:2.73, chg:-4.25},
                      v2:{1:[-29.21,29.21,-3.81,168.91], 2:[-22.86,22.86,1.27,158.75], batt:6.73, chg:-8.25} };
// mount versions (from CAD/Bay_Mount): enlarged perfboard extents the printed parts were built around
const MOUNT_EXT = { v1:[-22.86,22.86,-3.81,219.71], v2:[-22.86,22.86,-3.81,242.57] };
const offPlate = b => (LIB[b.type].kind==="Pyro" || (LIB[b.type].kind==="Batt" && b.face!=="back"));
const BACK_GAP = {SDCARD:2.5, BATT:1.0, BUZZ:2.0, BUCK:2.0};          // SD: header plastic (pins go into the perfboard); battery: foam pad (mm)

// ---- geometry helpers ----
const rot = (r,[x,y]) => { r=((r%4)+4)%4; return r===0?[x,y]:r===1?[-y,x]:r===2?[-x,-y]:[y,-x]; };
function geom(b){ // world positions given b={type,r,cu,cv,face}
  const L = LIB[b.type], p1 = rot(b.r, L.pins[0]), back = b.face==="back" && !offPlate(b) && L.kind!=="Spacer", PT = BTOP[brdOf(b)];
  const sg = back ? -1 : 1;                                   // back face = board flipped 180° about the rocket axis direction
  const ou = GU0 + b.cu*P - sg*p1[0], ov = b.cv*P - p1[1] + (MODE==="single" ? ((mnt()==="v2" && L.kind==="Batt" && offPlate(b)) ? 22.51 : 0)
        : (mnt()!=="none" && offPlate(b)) ? (L.kind==="Batt" ? MOUNT_EXT_S[mnt()].batt : MOUNT_EXT_S[mnt()].chg) : 0);
  const ic = rot(b.r, L.ic); const corners = [[L.bmin[0],L.bmin[1]],[L.bmax[0],L.bmin[1]],[L.bmax[0],L.bmax[1]],[L.bmin[0],L.bmax[1]]].map(c=>rot(b.r,c));
  const us = corners.map(c=>sg*c[0]+ou), vs = corners.map(c=>c[1]+ov);
  const nb = offPlate(b) ? -L.box[2]/2 : L.kind==="Spacer" ? BTOP[2] : back ? PT - PLATE_T - (BACK_GAP[b.type] ?? (MODE==="sandwich" ? L.sp : 2.0)) : PT + L.sp;
  const nA = nb + sg*L.bmax[2], nB = nb + sg*L.bmin[2];
  const rectW = (x0,y0,x1,y1) => { const c=[[x0,y0],[x1,y1]].map(q=>rot(b.r,q)), U=c.map(q=>sg*q[0]+ou), V=c.map(q=>q[1]+ov);
    return {u0:Math.min(...U), u1:Math.max(...U), v0:Math.min(...V), v1:Math.max(...V)}; };
  const body = L.ko ? rectW(L.bmin[0],L.bmin[1],L.bmax[0],L.bmax[1]-L.ko) : null;            // PCB only, without the antenna keep-out
  const koR = L.ko ? rectW(L.kox[0],L.bmax[1]-L.ko,L.kox[1],L.bmax[1]) : null;
  return {body, koR, ou, ov, nb, back, pt:PT, brd:L.kind==="Spacer"?0:brdOf(b), icU: sg*ic[0]+ou, icV: ic[1]+ov, icN: nb + sg*L.zc,
          u0: Math.min(...us), u1: Math.max(...us), v0: Math.min(...vs), v1: Math.max(...vs),
          ntop: Math.max(nA,nB), nbot: Math.min(nA,nB)};
}
const isSensor = b => ["IMU","Baro"].includes(LIB[b.type].kind);
function centerOf(b){ const g=geom(b); return isSensor(b) ? [g.icU, g.icV] : [(g.u0+g.u1)/2, (g.v0+g.v1)/2]; }   // sensors pivot about their IC
function placeCenter(b, cu0, cv0){ // re-snap so the pivot returns to (cu0,cv0) after a rotate/flip
  const [u,v]=centerOf(b); b.cu += Math.round((cu0-u)/P); b.cv += Math.round((cv0-v)/P); }
const mk = rows => rows.map(([id,type,r,cu,cv,face,brd])=>({id,type,r,cu,cv,face,brd}));
const SENSORS = [["BMP280_A","BMP280",0,-2,7,"front",1],["BMP280_B","BMP280",0,-2,12,"front",1],["MS5611","MS5611",1,4,17,"front",1],
 ["LSM6DSO","LSM6DSO",0,-4,25,"front",1],["BMI270_A","BMI270",0,-3,35,"front",1],["BMI270_B","BMI270",0,-3,46,"front",1]];   // unchanged between layouts
const PRESETS = {
 single: mk([...SENSORS, // Padam's layout, 16 Nov 2026
  ["ESP32","ESP32",0,-5,57,"front"],["BATTERY","BATT",0,-6,89,undefined],
  ["SD","SDCARD",2,-6,56,"back"],["PYRO_A","PYRO",0,-4,-18,undefined],["PYRO_B","PYRO",0,1,-18,undefined],
  ["MOSFET_A","TO220",0,-3,2,"front"],["MOSFET_B","TO220",0,2,2,"front"],["BUZZER","BUZZ",0,4,66,"back"]]),
 sandwich: mk([...SENSORS, // board 1 (front): sensors + FETs + buzzer, all facing out; board 2 (8 mm behind): ESP32, SD, buck, facing out the back
  ["MOSFET_A","TO220",0,-3,2,"front",1],["MOSFET_B","TO220",0,2,2,"front",1],["BUZZER","BUZZ",0,-4,56,"front",1],
  ["PYRO_A","PYRO",0,-4,-14,undefined],["PYRO_B","PYRO",0,1,-14,undefined],["BATTERY","BATT",0,-6,67,undefined],
  ["SD","SDCARD",0,4,4,"back",2],["ESP32","ESP32",0,5,26,"back",2],["BUCK_3V3","BUCK",0,2,56,"back",2],
  ["SP_BL","SPACER",0,-7,2,"front",1],["SP_BR","SPACER",0,8,2,"front",1],["SP_ML","SPACER",0,-7,31,"front",1],
  ["SP_MR","SPACER",0,8,31,"front",1],["SP_TL","SPACER",0,-7,60,"front",1],["SP_TR","SPACER",0,8,60,"front",1]]) };
const lsKey = () => MODE==="single" ? "sensorPlateLayout.v5" : "sensorPlateLayout.v8.sandwich";
const defaultLayout = () => PRESETS[MODE].map(b=>({...b}));
function loadLayout(){ let st=null; try { st = JSON.parse(localStorage.getItem(lsKey())||"null"); } catch(e){}
  const P0 = PRESETS[MODE]; return (Array.isArray(st) && st.length===P0.length && st.every((b,i)=>b.id===P0[i].id)) ? st : defaultLayout(); }
let layout = loadLayout();
const save = () => { try { localStorage.setItem(lsKey(), JSON.stringify(layout)); } catch(e){} };
let selected = layout.findIndex(b=>b.type==="LSM6DSO");

// ---- three.js scene: X = across plate (U), Y = rocket axis (V), Z = plate normal (N) ----
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio||1));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 1, 3000);
const controls = new THREE.OrbitControls(camera, canvas); controls.enableDamping = true; controls.screenSpacePanning = true;
controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.PAN };
canvas.addEventListener("mousedown", e=>{ if (e.button===1) e.preventDefault(); });   // stop browser auto-scroll on wheel click
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 0.85));
const dl = new THREE.DirectionalLight(0xffffff, 0.7); dl.position.set(60,120,140); scene.add(dl);
const dl2 = new THREE.DirectionalLight(0xffffff, 0.35); dl2.position.set(-80,-40,-60); scene.add(dl2);

function decode(b64, Type){ const bin = atob(b64), u8 = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i); return new Type(u8.buffer); }
const proto = {};
for (const k in window.BOARD_MESH){
  const g = new THREE.Group();
  for (const part of window.BOARD_MESH[k].parts){
    const q = decode(part.p, Int16Array), pos = new Float32Array(q.length), qs = window.BOARD_MESH[k].q || 200; for (let i=0;i<q.length;i++) pos[i]=q[i]/qs;

  buildMount(); update(); setView("iso"); }
$("mBrd").onclick=swapBoard; $("tMode").value=MODE; $("tMode").onchange=()=>setMode($("tMode").value);
$("tB2").onchange=()=>{ if (plate2) plate2.visible=$("tB2").checked; update(); };
$("tB2").parentElement.hidden = MODE!=="sandwich"; $("mBrd").disabled = MODE!=="sandwich";
$("mUp").onclick=()=>move(0,1); $("mDown").onclick=()=>move(0,-1); $("mLeft").onclick=()=>move(-1,0); $("mRight").onclick=()=>move(1,0); $("mRot").onclick=rotate; $("mFlip").onclick=flip;
$("list").addEventListener("click", e=>{ const r=e.target.closest(".row"); if(r){ selected=+r.dataset.i; update(); }});
window.addEventListener("keydown", e=>{ if (e.target.tagName==="TEXTAREA") return;
  const m={ArrowUp:[0,1],ArrowDown:[0,-1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];
  if (m){ e.preventDefault(); move(...m); } else if (e.key==="r"||e.key==="R") rotate(); else if (e.key==="f"||e.key==="F") flip(); else if (e.key==="b"||e.key==="B") swapBoard(); });
$("tFoot").onchange=update;
$("tMount").value=MOUNT; $("tMount").onchange=()=>{ MOUNT=$("tMount").value; try{localStorage.setItem("sensorPlateMount",MOUNT);}catch(e){} buildMount(); update(); }; $("tTube").onchange=()=>{tubeGrp.visible=$("tTube").checked}; $("tAxis").onchange=()=>{axisGrp.visible=$("tAxis").checked};
$("bReset").onclick=()=>{ layout.splice(0,layout.length,...defaultLayout()); update(); };
$("bCopy").onclick=async()=>{ const {G}=evaluate();
  const txt=JSON.stringify({units:"mm, grid 2.54; cu=hole column (0 = first hole right of axis is cu 1, left is cu 0 at -1.27); cv=hole row", plate_face_offset:-PLATE_TOP,
    layout:MODE, standoff_mm:MODE==="sandwich"?SPACER:undefined,
    boards:layout.map((b,i)=>({id:b.id,type:b.type,board:G[i].brd,face:offPlate(b)?"off":(G[i].back?"back":"front"),rot_deg:b.r*90,cu:b.cu,cv:b.cv,ic_across:+G[i].icU.toFixed(3),ic_normal:+G[i].icN.toFixed(3),ic_along:+G[i].icV.toFixed(2)}))},null,1);
  const ta=$("out"); ta.value=txt; ta.hidden=false;
  try{ await navigator.clipboard.writeText(txt); $("bCopy").textContent="Copied — paste it to Claude"; }
  catch(err){ ta.focus(); ta.select(); $("bCopy").textContent="Select the text below and copy"; }
  setTimeout(()=>$("bCopy").textContent="Copy layout for Claude",2500); };

// picking
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2(); let down=null;
canvas.addEventListener("pointerdown",e=>{down=[e.clientX,e.clientY]});
canvas.addEventListener("pointerup",e=>{ if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>4) return;
  const r=canvas.getBoundingClientRect(); mouse.set((e.clientX-r.left)/r.width*2-1, -(e.clientY-r.top)/r.height*2+1);
  ray.setFromCamera(mouse,camera); const hit=ray.intersectObjects(boardObjs.filter(o=>o.visible),true).find(h=>h.object.type==="Mesh");
  if(hit){ let o=hit.object; while(o && o.userData.idx===undefined) o=o.parent; if(o){selected=o.userData.idx; update();} } });

// views
function setView(v){ const {G}=evaluate(); const lo=Math.min(...G.map(g=>g.v0))-40, hi=Math.max(...G.map(g=>g.v1)); const vmid=(lo+hi)/2, span=hi-lo;
  const d=span*1.75+60; controls.target.set(0,vmid,0);
  const p={iso:[d*.55,vmid+d*.25,d*.75], front:[0,vmid,d], nose:[0,vmid+d,0.01], side:[d,vmid,0], back:[0,vmid,-d]}[v]; camera.position.set(...p); camera.up.set(0,1,0); if(v==="nose") camera.up.set(0,0,-1); controls.update(); }
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>setView(b.dataset.view));

function resize(){ const r=canvas.parentElement.getBoundingClientRect(); renderer.setSize(r.width,r.height,false); camera.aspect=r.width/r.height; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(canvas.parentElement);
function sceneBg(){ scene.background=new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue("--scene").trim()||"#dfe5ea"); }
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",sceneBg);
new MutationObserver(sceneBg).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
sceneBg(); resize(); buildMount(); update(); setView("iso");
(function loop(){ controls.update(); renderer.render(scene,camera); requestAnimationFrame(loop); })();
})();
</script>

</body></html>
